# Cấu hình pipeline — đổi giá trị ở đây để chọn detector/embedder mà không cần sửa code

pipeline:
  detector: "mediapipe"        # lựa chọn: mediapipe | retinaface | yolov8
  embedder: "sface"            # lựa chọn: sface | arcface | facenet512
  threshold: 0.32              # threshold cosine similarity mặc định theo combo

# Các ngưỡng này được hiệu chuẩn thực nghiệm dựa trên 20 ảnh (10 danh tính: 1x2, 3x4, ..., 19x20)
# kết hợp 3,600 lượt so khớp cặp ảnh stress-test (thiếu sáng, ngược sáng, góc nghiêng, nhiễu hạt).
# Nếu triển khai trên dữ liệu phòng mới, hãy chạy lại scripts/calibrate_thresholds.py để cập nhật.
thresholds:
  sface: 0.34                  # Ngưỡng tối ưu SFace (128-D, EER Optimal = 0.336)
  arcface: 0.26                # Ngưỡng tối ưu ArcFace (512-D, EER Optimal = 0.257)
  facenet512: 0.52             # Ngưỡng tối ưu FaceNet512 (512-D, EER Optimal = 0.517)

preprocessing:
  clahe:
    enabled: true
    clip_limit: 1.5
    tile_grid_size: [8, 8]
  denoise: true
  sharpen: true

enrollment:
  samples_per_person: 3        # số ảnh chụp khi đăng ký, dùng similarity max khi matching

liveness:
  enabled: true
  mode: "passive"              # passive (Laplacian variance, hoạt động với st.camera_input)
  laplacian_threshold: 100.0   # ngưỡng phân biệt ảnh thật/ảnh chụp lại màn hình

benchmark:
  n_repeats: 3                 # số lần lặp mỗi test case để lấy trung bình
  image_dir: "./data/test_images"
  output_csv: "./benchmarks/results/benchmark_results.csv"

export:
  onnx_opset: 17
  quantization:
    method: "dynamic"          # dynamic | static
    calibration_data_dir: "./data/processed"
    per_channel: true          # per-channel cho CNN
